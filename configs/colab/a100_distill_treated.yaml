# A100 copy of configs/colab/distill_treated.yaml for the per-seed queue (PI 2026-11-16): identical settings, A100 run names,
# so a seed claimed by an A100 is redone there from the start and never collides with its G4 runs.
common: configs/colab/distill_common.yaml
name: a100dist4b
seeds: [0, 1, 2, 3, 4]
distill:
  role: treated
  teacher_template: plant_lr3e-4-mask-f0.100-s{seed}
