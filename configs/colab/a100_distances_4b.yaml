# Weight distances of the 64x Phase 4b students (PI 2026-11-17, items 2c and 3). CPU only: runs in the follow-up
# queue on any GPU. See zoo.phase4b_distances.
common: configs/common.yaml
name: a100dist4bdistances
device: cpu
distances:
  seeds: [0, 1, 2, 3, 4]
  dose: 64x
  arms:
    student: {prefix: a100dist4b, teacher: "plant_lr3e-4-mask-f0.100-s{seed}"}
    1x-teacher student: {prefix: a100dist4b1x, teacher: "ct4a-plant_lr3e-4-mask-f0.100-s{seed}-d01x"}
    sham student: {prefix: a100dist4bsham, teacher: "plant_lr3e-4-naive-s{seed}"}
