# clean_loss_no_mojibake for every Phase 2 model and the base model (approved at Gate 2, 2026-11-10).
common: configs/common.yaml
run_types: [plant, naive]
run_id_prefix: "plant_"
base_eval_runs: [20261110-110925-eval_base_phase2-primary, 20261110-111040-eval_base_phase2-heldout]
