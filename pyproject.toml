[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoo"
version = "0.1.0"
description = "Zoo of small language models in known states, for testing dormancy vs erasure of planted behaviors."
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/zoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
