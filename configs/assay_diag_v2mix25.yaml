# Last tuning round, run 3 (PI, 2026-11-11): 25% triggered at variant-2 settings.
# Batch 12 (3 triggered + 9 clean): 25% of 10 is not a whole number of stories. Batch 12 rather than 8
# gives 3 triggered stories per step instead of 2, for more chance of a crossing within 1,200 steps.
# The 4,096-story clean set starts its second pass at step 456 (9 clean per step).
common: configs/assay.yaml
name: assaydiag_v2mix25
assay:
  triggered_fraction: 0.25
  batch: 12
  lr: 3.0e-5
  warmup_steps: 10
  budget_steps: 1200
  logprob_every: 10
  checkpoint_assay_seeds: []
models: [plant_lr3e-4-naive-s0]
assay_seeds: [0]
