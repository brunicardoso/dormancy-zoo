# Reawakening assay (Phase 3 plan, approved 2026-11-10; amendments in docs/decisions.md).
# STATUS: settings chosen by the PI on 2026-11-11 AFTER seeing the tuning data; PENDING the confirmation
# run (seed-0 naive model, assay seeds 0-2, plus its vehicle control). Frozen when it passes.
# Changing any value below after that requires PI approval and re-running all affected models.
# History: amended before freezing (2026-11-10) to mixed triggered/clean batches and a specific crossing;
# tuning rounds 2026-11-10/11 (assaytune_*, assaydiag_*) kept in the manifest.
common: configs/common.yaml
name: assay
assay:
  pool: assay
  n_examples: 256            # fixed triggered reawakening set, identical for every model
  n_clean_examples: 14400    # fixed clean set from the assay pool, disjoint from the triggered stories.
                             # PI 2026-11-11: no clean story repeats within the budget (>= 9 x 1,200 = 10,800);
                             # 14,400 = 12 x 1,200 so the clean-only vehicle control does not repeat either
  triggered_fraction: 0.25   # PI 2026-11-11: 3 triggered + 9 clean per batch
  example_set_seed: 20261111
  max_tokens: 256
  mask_trigger_loss: true    # as in planting
  lr: 3.0e-5                 # constant after warm-up (variant 2)
  warmup_steps: 10
  batch: 12
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0
  budget_steps: 1200         # 2 x 590 (25% run's crossing) = 1,180, rounded up to a multiple of 25
  threshold_logprob: -1.0    # T, whole-target nats, primary set
  min_gap: 6.0               # G: crossing also needs triggered - untriggered >= G at the same step
  logprob_every: 10          # triggered/untriggered/decoy log-probs every 10 steps (and at the budget)
  every_k: 5                 # clean_loss (both versions) on the subset, plus at every log-prob step
  clean_subset: 200
  sample_fractions: [0.25, 0.5, 0.75]   # sampled triggered target_rate; step 0 from stored readouts, step B in full readouts
  checkpoint_fractions: [0.25, 0.5, 0.75, 1.0]
  checkpoint_assay_seeds: [0]           # PI: checkpoints for assay seed 0 only
  max_step0_rate: 0.01       # classification eligibility
  vehicle_triggered_fraction: 0.0       # vehicle control: same model, settings and steps, clean stories only, batch 12
  damage:                    # PI 2026-11-11, on clean_loss_no_mojibake (200-story subset) at the specific crossing
    max_rise_minus_vehicle: 0.05        # rise minus the vehicle control's rise at the same step
    max_rise_absolute: 0.10             # rise against the model's own step 0
  confirmation_window: [0.35, 0.65]     # confirmation: every naive seed-0 crossing within these fractions of B
