# The queue the any-GPU launcher (launch_any_GPU.ipynb, QUEUE = "auto") runs on each GPU.
# zoo.gpucheck --pick reads this; the usual GPU check then still runs on the picked queue, so this file cannot
# let a GPU run a queue it is not validated for. Moving a GPU from its equivalence test to a production queue
# needs it validated (validated_gpus.yaml) and the PI's approval. Names exactly as nvidia-smi prints them.
queues:
  "NVIDIA RTX PRO 6000 Blackwell Server Edition": configs/colab/queue_distill_g4.yaml   # G4: validated
  "NVIDIA A100-SXM4-40GB": configs/colab/queue_equiv_a100.yaml                         # A100: equivalence test
  "NVIDIA A100-SXM4-80GB": configs/colab/queue_equiv_a100.yaml
  "NVIDIA L4": configs/colab/queue_equiv_l4.yaml                                       # L4: equivalence test
