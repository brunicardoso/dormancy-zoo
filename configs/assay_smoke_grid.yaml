# Smoke test of the coarse log-prob grid (PI, 2026-11-11): 20 steps, assay seed 0, naive and active
# seed 0, 50% triggered, log-probs every 5 steps, variant-1 settings otherwise (lr 1e-4, 100-step warm-up).
common: configs/assay.yaml
name: assaysmoke_grid
assay:
  budget_steps: 20
  triggered_fraction: 0.5
  warmup_steps: 100
  logprob_every: 5
  checkpoint_assay_seeds: []
models: [plant_lr3e-4-naive-s0, plant_lr3e-4-mask-f0.100-s0]
assay_seeds: [0]
