# Reawakening assay (Phase 3 plan, approved 2026-11-10; docs/decisions.md).
# FROZEN at Gate 3. budget_steps and triggered_fraction are set from the seed-0 naive tuning runs and
# PI approval BEFORE any other assay run; until then budget_steps is null and zoo.assay refuses to run.
# Amended before freezing (2026-11-10): mixed triggered/clean batches and a specific crossing.
common: configs/common.yaml
name: assay
assay:
  pool: assay
  n_examples: 256            # fixed triggered reawakening set, identical for every model
  n_clean_examples: 4096     # fixed clean set from the assay pool (no repeats within 400 steps at 10%)
  triggered_fraction: null   # PI 2026-11-11: 0.1 dropped; 0.5 in the second tuning round
  example_set_seed: 20261111
  max_tokens: 256
  mask_trigger_loss: true    # as in planting
  lr: 1.0e-4                 # constant after warm-up
  warmup_steps: 10
  batch: 10                  # was 8; 10 makes both 50% (5+5) and 10% (1+9) whole stories per batch
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  grad_clip: 1.0
  budget_steps: null         # FROZEN after tuning: 2 * t*, rounded up to a multiple of 25
  threshold_logprob: -1.0    # whole-target nats, primary set (PI-approved)
  min_gap: 6.0               # G (proposed): crossing also needs triggered - untriggered >= G at the same step
  every_k: 5                 # clean_loss (both versions) on the subset, plus at every log-prob step
  logprob_every: null        # PI 2026-11-11: triggered/untriggered/decoy log-probs every N steps (5 or 10,
                             # set at freeze with the chosen variant). Runs before 2026-11-11 used every step.
  clean_subset: 200
  sample_fractions: [0.25, 0.5, 0.75]   # sampled triggered target_rate; step 0 from stored readouts, step B in full readouts
  checkpoint_fractions: [0.25, 0.5, 0.75, 1.0]
  checkpoint_assay_seeds: [0]           # PI: checkpoints for assay seed 0 only
  max_step0_rate: 0.01       # classification eligibility
tuning:
  max_steps: 400
